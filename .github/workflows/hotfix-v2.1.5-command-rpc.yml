name: Hotfix v2.1.5 command RPC
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hotfix-v2.1.5-command-rpc.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch command sending
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('GangHelper.lua')
          s = p.read_text(encoding='utf-8')
          old = """    local actionKey = actionType .. ':' .. weapon.command\n    sampSendChat(toGameEncoding(antiRepeatMessage(actionKey, message)))\n"""
          new = """    local actionKey = actionType .. ':' .. weapon.command\n    if message:sub(1, 1) == '/' then\n        -- Slash commands must use SA-MP's command RPC. Sending them through\n        -- sampSendChat can make the server parse them as incomplete chat text.\n        sampSendCommand(toGameEncoding(message))\n    else\n        sampSendChat(toGameEncoding(antiRepeatMessage(actionKey, message)))\n    end\n"""
          if old not in s:
              raise SystemExit('target send block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
          grep -F "sampSendCommand(toGameEncoding(message))" GangHelper.lua
          rm .github/workflows/hotfix-v2.1.5-command-rpc.yml

      - name: Commit and retag v2.1.5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "semaka47"
          git config user.email "konnybzone0@gmail.com"
          git add GangHelper.lua .github/workflows/hotfix-v2.1.5-command-rpc.yml
          git commit -m "Hotfix v2.1.5 slash command dispatch"
          RELEASE_SHA="$(git rev-parse HEAD)"
          git tag -f -a v2.1.5 -m "Gang Helper v2.1.5" "$RELEASE_SHA"
          git push origin main
          git push --force origin refs/tags/v2.1.5

      - name: Verify tagged command and hash
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..12}; do
            if curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/v2.1.5/GangHelper.lua" -o /tmp/GangHelper.lua; then
              grep -Fq "sampSendCommand(toGameEncoding(message))" /tmp/GangHelper.lua && break
            fi
            sleep 3
          done
          grep -Fq "sampSendCommand(toGameEncoding(message))" /tmp/GangHelper.lua
          sha256sum /tmp/GangHelper.lua | awk '{print $1}' > /tmp/newsha
          cat /tmp/newsha

      - name: Refresh updater manifest
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(cat /tmp/newsha)"
          python - "$SHA" <<'PY'
          import json, sys
          from pathlib import Path
          sha = sys.argv[1]
          p = Path('updater/manifest.json')
          m = json.loads(p.read_text(encoding='utf-8'))
          m['version'] = 'v2.1.5'
          m['download_url'] = 'https://raw.githubusercontent.com/semaka47/GangHelper/v2.1.5/GangHelper.lua'
          m['sha256'] = sha
          ro = 'Comenzile slash generate de aliasuri sunt trimise acum prin command RPC, fără anti-repeat, pentru ca /sellgun ID arma 1 să ajungă complet la server.'
          en = 'Slash commands generated by aliases now use the command RPC without anti-repeat, so /sellgun ID weapon 1 reaches the server intact.'
          if ro not in m.get('changelog_ro', []):
              m.setdefault('changelog_ro', []).append(ro)
          if en not in m.get('changelog_en', []):
              m.setdefault('changelog_en', []).append(en)
          p.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git add updater/manifest.json
          git commit -m "Refresh updater manifest for v2.1.5 command hotfix"
          git push origin main

      - name: Verify public manifest
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(cat /tmp/newsha)"
          for i in {1..12}; do
            if curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/updater/manifest.json" -o /tmp/manifest.json; then
              python - "$EXPECTED" <<'PY'
          import json, sys
          m = json.load(open('/tmp/manifest.json', encoding='utf-8'))
          assert m['version'] == 'v2.1.5'
          assert m['download_url'] == 'https://raw.githubusercontent.com/semaka47/GangHelper/v2.1.5/GangHelper.lua'
          assert m['sha256'] == sys.argv[1]
          PY
              exit 0
            fi
            sleep 3
          done
          exit 1
